<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Resume Screener Pro — Smart Candidate Ranking</title>
  <meta name="description" content="AI-powered candidate screening platform using TF-IDF, sentence embeddings, and skill gap normalization.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 22, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(124, 92, 255, 0.4);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-purple: #7c5cff;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-coral: #ef4444;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(124, 92, 255, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(6, 182, 212, 0.10) 0%, transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    h1, h2, h3, h4, .brand-font {
      font-family: 'Outfit', sans-serif;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* Glass Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.14);
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 99px;
      background: rgba(124, 92, 255, 0.1);
      border: 1px solid rgba(124, 92, 255, 0.3);
      color: #a78bfa;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 16px;
    }

    .header-badge .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-purple);
      box-shadow: 0 0 10px var(--accent-purple);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(124, 92, 255, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(124, 92, 255, 0); }
    }

    h1.title {
      font-size: clamp(34px, 5vw, 54px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 40%, #7c5cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 620px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Layout Grid */
    .grid-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 24px;
      margin-bottom: 36px;
    }

    @media (max-width: 960px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Section Labels */
    .label-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .label-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Inputs */
    textarea.jd-input {
      width: 100%;
      min-height: 220px;
      background: rgba(10, 14, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      color: var(--text-main);
      padding: 16px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea.jd-input:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2);
    }

    /* Dropzone */
    .dropzone {
      margin-top: 18px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.25s ease;
    }

    .dropzone:hover, .dropzone.drag-active {
      border-color: var(--accent-purple);
      background: rgba(124, 92, 255, 0.06);
    }

    .dropzone-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
      border-radius: 12px;
      background: rgba(124, 92, 255, 0.15);
      color: #a78bfa;
      display: grid;
      place-items: center;
    }

    /* File List Chips */
    .file-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12.5px;
      color: var(--text-main);
    }

    .file-chip-remove {
      cursor: pointer;
      color: var(--text-dim);
      font-size: 14px;
      transition: color 0.15s;
    }

    .file-chip-remove:hover {
      color: var(--accent-coral);
    }

    /* Sliders */
    .slider-group {
      margin-bottom: 22px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      margin-bottom: 8px;
    }

    .slider-header span.val {
      font-weight: 700;
      color: #a78bfa;
    }

    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1e293b;
      appearance: none;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-purple);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(124, 92, 255, 0.6);
      transition: transform 0.15s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-purple), #5b21b6);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(124, 92, 255, 0.5);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(124, 92, 255, 0.7);
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Results Header & Tabs */
    .results-section {
      margin-top: 10px;
    }

    .tabs-bar {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
      padding-bottom: 12px;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: rgba(124, 92, 255, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(124, 92, 255, 0.3);
    }

    /* Candidate Card */
    .candidate-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px 26px;
      margin-bottom: 18px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeInUp 0.4s ease both;
    }

    .candidate-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .candidate-row {
      display: grid;
      grid-template-columns: 60px 80px 1fr;
      gap: 20px;
      align-items: center;
    }

    @media (max-width: 680px) {
      .candidate-row {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .score-ring { margin: 0 auto; }
    }

    .rank-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--text-dim);
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .rank-badge.top-1 {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.3);
    }

    .rank-badge.top-2 {
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.12);
      border-color: rgba(148, 163, 184, 0.3);
    }

    .rank-badge.top-3 {
      color: #b45309;
      background: rgba(180, 83, 9, 0.12);
      border-color: rgba(180, 83, 9, 0.3);
    }

    /* Score Ring */
    .score-ring {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--ring-color) calc(var(--score) * 1%), rgba(255, 255, 255, 0.08) 0);
    }

    .score-ring::before {
      content: attr(data-score);
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #0f131f;
      display: grid;
      place-items: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 17px;
      color: var(--text-main);
    }

    .candidate-info {
      min-width: 0;
    }

    .candidate-name {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-bars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 12px;
    }

    @media (max-width: 580px) {
      .score-bars { grid-template-columns: 1fr; }
    }

    .score-bar-label {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .score-bar-track {
      height: 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
      transition: width 0.8s ease-out;
    }

    /* Skill Tags */
    .skills-breakdown {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .skill-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 99px;
      margin-right: 6px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .skill-tag.matched {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .skill-tag.missing {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Alert boxes */
    .alert-banner {
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .alert-info {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: #67e8f9;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Sample data for quick testing presets
    const SAMPLE_JD = `We are seeking a Senior AI/NLP Software Engineer to design, build, and deploy machine learning pipelines and FastAPI REST services. 

Requirements:
- Strong proficiency in Python, PyTorch, and scikit-learn
- Hands-on experience with Natural Language Processing (NLP), TF-IDF, and Sentence Embeddings (SentenceTransformers)
- Deep understanding of SQL databases, Docker containerization, and RESTful API architecture
- Experience with Git, CI/CD, and Cloud deployment (Railway, AWS, or Vercel)`;

    const SAMPLE_RESUMES = [
      {
        name: "Alice_Senior_NLP_Engineer.txt",
        content: `Alice Vance
Senior Machine Learning & NLP Engineer
Email: alice@example.com | GitHub: github.com/alice-ai

Summary:
5+ years experience building production AI systems. Specialized in Python, PyTorch, Hugging Face, sentence embeddings, TF-IDF, and scikit-learn. Built scalable REST APIs using FastAPI, Docker, and PostgreSQL. Deployed models on AWS and Railway.`
      },
      {
        name: "Bob_Backend_Developer.txt",
        content: `Bob Smith
Full Stack & Backend Developer

Summary:
Backend developer with 4 years in Python, FastAPI, SQL, PostgreSQL, Docker, and Git. Some knowledge of basic machine learning and scikit-learn. Strong web API design and CI/CD pipelines.`
      },
      {
        name: "Charlie_Frontend_Dev.txt",
        content: `Charlie Brown
Frontend Web Developer

Summary:
Creative frontend engineer focused on React, TypeScript, HTML, CSS, Tailwind, and Node.js. Basic scripting experience in Python. Passionate about UI/UX design.`
      }
    ];

    function App() {
      const [jd, setJd] = useState('');
      const [files, setFiles] = useState([]);
      const [wTfidf, setWTfidf] = useState(0.35);
      const [wSem, setWSem] = useState(0.40);
      const [wCov, setWCov] = useState(0.25);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [resultsData, setResultsData] = useState(null);
      const [activeTab, setActiveTab] = useState('rankings');
      const [dragActive, setDragActive] = useState(false);
      const fileInputRef = useRef(null);

      const totalWeight = (wTfidf + wSem + wCov) || 1;
      const normalizedWeights = {
        tfidf: Math.round((wTfidf / totalWeight) * 100),
        sem: Math.round((wSem / totalWeight) * 100),
        cov: Math.round((wCov / totalWeight) * 100),
      };

      const handleFileUpload = (uploadedFiles) => {
        const valid = Array.from(uploadedFiles).filter(f => /\.(pdf|txt)$/i.test(f.name));
        setFiles(prev => [...prev, ...valid]);
      };

      const removeFile = (index) => {
        setFiles(prev => prev.filter((_, i) => i !== index));
      };

      const loadSamplePreset = () => {
        setJd(SAMPLE_JD);
        const sampleFileObjects = SAMPLE_RESUMES.map(sr => {
          const blob = new Blob([sr.content], { type: 'text/plain' });
          return new File([blob], sr.name, { type: 'text/plain' });
        });
        setFiles(sampleFileObjects);
      };

      const rankResumes = async () => {
        if (!jd.trim() || files.length === 0) return;
        setLoading(true);
        setError(null);

        const formData = new FormData();
        formData.append('jd', jd);
        formData.append('w_tfidf', wTfidf);
        formData.append('w_sem', wSem);
        formData.append('w_cov', wCov);
        files.forEach(f => formData.append('files', f));

        try {
          const res = await fetch('/api/rank', {
            method: 'POST',
            body: formData,
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Ranking request failed.');
          setResultsData(data);
          setActiveTab('rankings');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const getColorForScore = (s) => {
        if (s >= 75) return '#10b981';
        if (s >= 50) return '#f59e0b';
        return '#ef4444';
      };

      const exportCSV = () => {
        if (!resultsData || !resultsData.results) return;
        const headers = ["Rank", "Candidate", "Score", "Keyword Match", "Semantic Match", "Skill Coverage", "Matched Skills", "Missing Skills"];
        const rows = resultsData.results.map((r, i) => [
          i + 1,
          `"${r.name}"`,
          r.score,
          Math.round(r.tfidf * 100) + '%',
          Math.round(r.semantic * 100) + '%',
          Math.round(r.coverage * 100) + '%',
          `"${(r.matched || []).join(', ')}"`,
          `"${(r.missing || []).join(', ')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "resume_rankings_report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="container">
          <header>
            <div className="header-badge">
              <span className="pulse-dot"></span>
              <span>FastAPI & SentenceTransformers NLP Engine</span>
            </div>
            <h1 className="title">AI Resume Screener Pro</h1>
            <p>
              Rank candidate resumes against job descriptions with hybrid TF-IDF lexical match, 
              dense vector embeddings, and alias-normalized skill coverage.
            </p>
          </header>

          <div className="grid-layout">
            {/* Left Card: JD & Upload */}
            <div className="glass-card">
              <div className="label-header">
                <span className="label-title">
                  📝 Job Description
                </span>
                <button className="btn-secondary" onClick={loadSamplePreset}>
                  ⚡ Load Demo Preset
                </button>
              </div>

              <textarea 
                className="jd-input"
                placeholder="Paste the job description here or click 'Load Demo Preset'..."
                value={jd}
                onChange={(e) => setJd(e.target.value)}
              />

              <div className="label-header" style={{ marginTop: '22px' }}>
                <span className="label-title">
                  📂 Upload Resumes (PDF / TXT)
                </span>
                {files.length > 0 && (
                  <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
                    {files.length} file(s) attached
                  </span>
                )}
              </div>

              <div 
                className={`dropzone ${dragActive ? 'drag-active' : ''}`}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
                onDragLeave={() => setDragActive(false)}
                onDrop={(e) => {
                  e.preventDefault();
                  setDragActive(false);
                  handleFileUpload(e.dataTransfer.files);
                }}
              >
                <div className="dropzone-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>
                <div style={{ fontWeight: 600, fontSize: '14.5px', marginBottom: '4px' }}>
                  Click to upload or drag & drop files
                </div>
                <div style={{ fontSize: '12.5px', color: 'var(--text-muted)' }}>
                  Supports multiple PDF or TXT resumes
                </div>
                <input 
                  type="file" 
                  ref={fileInputRef} 
                  multiple 
                  accept=".pdf,.txt" 
                  style={{ display: 'none' }}
                  onChange={(e) => handleFileUpload(e.target.files)}
                />
              </div>

              {files.length > 0 && (
                <div className="file-chips">
                  {files.map((f, i) => (
                    <div key={i} className="file-chip">
                      <span>📄 {f.name}</span>
                      <span className="file-chip-remove" onClick={(e) => { e.stopPropagation(); removeFile(i); }}>✕</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Right Card: Weights & Trigger */}
            <div className="glass-card" style={{ display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
              <div>
                <div className="label-header" style={{ marginBottom: '18px' }}>
                  <span className="label-title">
                    ⚙️ Scoring Model Weights
                  </span>
                </div>

                <div className="slider-group">
                  <div className="slider-header">
                    <span>Keyword Match (TF-IDF)</span>
                    <span className="val">{normalizedWeights.tfidf}%</span>
                  </div>
                  <input 
                    type="range" min="0" max="1" step="0.05" 
                    value={wTfidf} 
                    onChange={(e) => setWTfidf(parseFloat(e.target.value))} 
                  />
                </div>

                <div className="slider-group">
                  <div className="slider-header">
                    <span>Semantic Match (Sentence Embeddings)</span>
                    <span className="val">{normalizedWeights.sem}%</span>
                  </div>
                  <input 
                    type="range" min="0" max="1" step="0.05" 
                    value={wSem} 
                    onChange={(e) => setWSem(parseFloat(e.target.value))} 
                  />
                </div>

                <div className="slider-group">
                  <div className="slider-header">
                    <span>Skill Lexicon Coverage</span>
                    <span className="val">{normalizedWeights.cov}%</span>
                  </div>
                  <input 
                    type="range" min="0" max="1" step="0.05" 
                    value={wCov} 
                    onChange={(e) => setWCov(parseFloat(e.target.value))} 
                  />
                </div>

                <div style={{ background: 'rgba(255,255,255,0.03)', padding: '14px', borderRadius: 'var(--radius-sm)', fontSize: '12.5px', color: 'var(--text-muted)', lineHeight: '1.5', marginTop: '12px' }}>
                  💡 <strong>Hybrid Normalization:</strong> Weights automatically sum to 100%. TF-IDF checks terminology overlap, Sentence Transformers capture conceptual context, and Skill Coverage tracks exact technical requirements.
                </div>
              </div>

              <div style={{ marginTop: '24px' }}>
                {error && (
                  <div className="alert-banner alert-error">
                    ⚠️ {error}
                  </div>
                )}

                <button 
                  className="btn-primary"
                  disabled={loading || !jd.trim() || files.length === 0}
                  onClick={rankResumes}
                >
                  {loading ? (
                    <>
                      <div className="spinner"></div>
                      <span>Analyzing & Ranking...</span>
                    </>
                  ) : (
                    <>
                      <span>✨ Rank Candidates Now</span>
                    </>
                  )}
                </button>
              </div>
            </div>
          </div>

          {/* Results Section */}
          {resultsData && (
            <div className="results-section">
              <div className="tabs-bar">
                <button 
                  className={`tab-btn ${activeTab === 'rankings' ? 'active' : ''}`}
                  onClick={() => setActiveTab('rankings')}
                >
                  🏆 Candidate Ranking ({resultsData.results.length})
                </button>
                <button 
                  className="tab-btn"
                  onClick={exportCSV}
                  style={{ marginLeft: 'auto', background: 'rgba(16, 185, 129, 0.1)', color: '#34d399', border: '1px solid rgba(16, 185, 129, 0.3)' }}
                >
                  📥 Export CSV Report
                </button>
              </div>

              {!resultsData.semantic_enabled && (
                <div className="alert-banner alert-info">
                  ℹ️ Semantic sentence embeddings model was unavailable on this server instance; weights were automatically re-allocated between keyword match and skill coverage.
                </div>
              )}

              {resultsData.skipped && resultsData.skipped.length > 0 && (
                <div className="alert-banner alert-error">
                  ⚠️ No readable text extracted from: {resultsData.skipped.join(', ')} (Scanned PDFs require OCR).
                </div>
              )}

              {/* Candidate Cards List */}
              {resultsData.results.map((c, idx) => {
                const scoreColor = getColorForScore(c.score);
                const rankClass = idx === 0 ? 'top-1' : idx === 1 ? 'top-2' : idx === 2 ? 'top-3' : '';
                return (
                  <div key={idx} className="candidate-card" style={{ animationDelay: `${idx * 80}ms` }}>
                    <div className="candidate-row">
                      <div className={`rank-badge ${rankClass}`}>
                        #{idx + 1}
                      </div>

                      <div 
                        className="score-ring" 
                        style={{ '--score': c.score, '--ring-color': scoreColor }}
                        data-score={c.score}
                      />

                      <div className="candidate-info">
                        <div className="candidate-name" title={c.name}>
                          {c.name}
                        </div>

                        <div className="score-bars">
                          <div>
                            <div className="score-bar-label">
                              <span>Keyword (TF-IDF)</span>
                              <span>{Math.round(c.tfidf * 100)}%</span>
                            </div>
                            <div className="score-bar-track">
                              <div className="score-bar-fill" style={{ width: `${c.tfidf * 100}%` }} />
                            </div>
                          </div>

                          {resultsData.semantic_enabled && (
                            <div>
                              <div className="score-bar-label">
                                <span>Semantic</span>
                                <span>{Math.round(c.semantic * 100)}%</span>
                              </div>
                              <div className="score-bar-track">
                                <div className="score-bar-fill" style={{ width: `${c.semantic * 100}%` }} />
                              </div>
                            </div>
                          )}

                          <div>
                            <div className="score-bar-label">
                              <span>Skill Coverage</span>
                              <span>{Math.round(c.coverage * 100)}%</span>
                            </div>
                            <div className="score-bar-track">
                              <div className="score-bar-fill" style={{ width: `${c.coverage * 100}%` }} />
                            </div>
                          </div>
                        </div>

                        <div className="skills-breakdown">
                          {(c.matched || []).map((s, i) => (
                            <span key={i} className="skill-tag matched">✓ {s}</span>
                          ))}
                          {(c.missing || []).map((s, i) => (
                            <span key={i} className="skill-tag missing">✕ {s}</span>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
